[project]
name = "pyo3-introspection"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
]
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
dynamic = [
    "authors",
    "description",
    "keywords",
    "license",
    "maintainers",
    "readme",
    "version",
]

[project.urls]
Changelog = "https://github.com/PyO3/pyo3/blob/main/CHANGELOG.md"
Documentation = "https://pyo3.rs/"
Homepage = "https://pyo3.rs/"
Source = "https://github.com/PyO3/pyo3/tree/main/pyo3-introspection"
Tracker = "https://github.com/PyO3/pyo3/issues"

[build-system]
# `license-files` are relative to the root of the sdist, which is also where the
# `License-File` entries in `PKG-INFO` point. maturin only started copying the
# matched files there in 1.9.3; older releases left them next to this file
# (i.e. under `pyo3-introspection/`), which PyPI rejects on upload.
# See https://github.com/PyO3/pyo3/issues/6303.
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
